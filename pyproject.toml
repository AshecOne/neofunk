[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neofunk"
version = "0.1.0"
description = "Ubah suara (humming / nyanyi / beatbox melodi) menjadi not musik: MIDI & MusicXML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
]

[project.optional-dependencies]
# Pitch tracker neural (GPU, lebih akurat untuk suara manusia)
gpu = ["torch>=2.1", "torchcrepe>=0.0.22"]
# Ekspor partitur (MusicXML -> bisa dibuka di MuseScore)
score = ["music21>=9.1"]
# Spotify Basic Pitch sebagai backend alternatif
basicpitch = ["basic-pitch>=0.4"]
# ROSVOT (model note-level khusus suara nyanyi, butuh GPU NVIDIA). Lalu: neofunk setup rosvot
rosvot = [
    "torch>=2.1",
    "gdown>=5",
    "pyworld>=0.3",
    "setuptools<81",  # pyworld masih import pkg_resources
    "pyloudnorm",
    "scikit-image",
    "textgrid",
    "webrtcvad-wheels",
    "mir_eval>=0.7",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "six",
]
# Download dataset (HumTrans dari Hugging Face)
data = ["huggingface_hub>=0.20"]
# Benchmark akurasi
eval = ["mir_eval>=0.7"]
# rekam dari mikrofon
record = ["sounddevice>=0.4"]
all = ["neofunk[gpu,score,rosvot,data,eval,record]"]
dev = ["pytest>=7", "mir_eval>=0.7"]

[project.scripts]
neofunk = "neofunk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
